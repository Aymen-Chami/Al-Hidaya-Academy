# Development overrides (merged automatically by `docker compose up`).
# - API runs the dev image with the source bind-mounted and --reload, on 127.0.0.1:8000
# - Postgres is reachable from the host on 127.0.0.1:${DB_HOST_PORT:-55432}
# - Mailpit catches all outgoing email: UI at http://localhost:8025
# - The nginx `web` service is opt-in (`--profile web`); normally run `npm run dev` on the host.
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"

  migrate:
    build:
      context: ./backend
      target: dev
    image: alhidaya-api:dev
    volumes:
      - ./backend:/app

  api:
    build:
      context: ./backend
      target: dev
    image: alhidaya-api:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    environment:
      # Default to Mailpit, but let .env point at a real relay (see the Gmail block in .env.example).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  web:
    profiles: ["web"]
