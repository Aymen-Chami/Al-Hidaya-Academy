# Serves the React build and proxies /api to FastAPI on the same origin, so the session cookie
# works without CORS. Put TLS in front of this (a load balancer, Caddy, or certbot + nginx).

# Throttle the auth endpoints per client IP (sign-up codes, login, password reset).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;

    include /etc/nginx/conf.d/security_headers.inc;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Same JSON error shape as the API, so the frontend handles it like any other error.
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait a minute and try again.","details":null}}';
    }

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html (never cached, so deploys show up immediately).
    location / {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
