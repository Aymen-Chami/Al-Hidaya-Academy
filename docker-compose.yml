# Production-like stack. For local development, docker-compose.override.yml is merged in
# automatically; to run WITHOUT the dev overrides use:
#   docker compose -f docker-compose.yml up -d --build
name: alhidaya

x-api: &api
  build:
    context: ./backend
    target: prod
  image: alhidaya-api:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alhidaya}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-alhidaya}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alhidaya}
      POSTGRES_USER: ${POSTGRES_USER:-alhidaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The API starts only after it succeeds.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # React build served by nginx, which also proxies /api to the API (same origin → cookie auth).
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: alhidaya-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
